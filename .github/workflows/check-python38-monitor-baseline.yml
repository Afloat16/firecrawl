name: Check upstream Python 3.8 test assumption
on:
  push:
    branches:
      - qa/python-monitor-py38-baseline-20261120
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'Afloat16/firecrawl'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: firecrawl/firecrawl
          ref: a38c6812f22ec1c97c97fcad431d8bcc728e3e89
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.8"
      - name: Install upstream SDK dependencies
        run: |
          python -m pip install --no-cache-dir -r baseline/apps/python-sdk/requirements.txt
          python -m pip install --no-cache-dir --no-deps -e baseline/apps/python-sdk
      - name: Reproduce unchanged to_thread test failure
        working-directory: baseline/apps/python-sdk
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = a38c6812f22ec1c97c97fcad431d8bcc728e3e89
          test -z "$(git diff --name-only)"
          python - <<'PY'
          import asyncio
          import pathlib
          import firecrawl
          pathlib.Path(firecrawl.__file__).resolve().relative_to(pathlib.Path.cwd())
          assert not hasattr(asyncio, "to_thread")
          print("Unmodified baseline:", firecrawl.__file__)
          PY
          set +e
          python -m pytest firecrawl/__tests__/unit/v2/methods/aio/test_ensure_async.py::test_async_transport_used_no_threads -q --tb=short --junitxml="$RUNNER_TEMP/upstream-py38.xml"
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "upstream-py38.xml")).getroot()
          cases = root.findall(".//testcase")
          assert len(cases) == 1
          assert cases[0].attrib["name"] == "test_async_transport_used_no_threads"
          failure = cases[0].find("failure")
          assert failure is not None
          assert "AttributeError" in failure.attrib["message"]
          assert "to_thread" in failure.attrib["message"]
          assert not root.findall(".//error")
          assert not root.findall(".//skipped")
          print("Confirmed the same to_thread failure on unmodified upstream")
          PY
